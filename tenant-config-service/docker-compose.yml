version: '3.8'

services:
  config-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: moveinsync/tenant-config-service:1.0.0
    container_name: moveinsync-config-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-XX:+UseG1GC -Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
